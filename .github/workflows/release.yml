# Attaches ds-webp-squoosh.zip to every published release. Sites running the
# regular plugin find it through updater.php and auto-update to it.
name: Release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: this job's output auto-installs on every site.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match plugin Version header and VERSION const
        run: |
          file=ds-webp-squoosh/ds-webp-squoosh.php
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version: *//p' "$file")
          const=$(sed -n "s/.*const VERSION = '\(.*\)';/\1/p" "$file")
          if [ "$tag" != "$header" ] || [ "$tag" != "$const" ]; then
            echo "::error::Tag $tag does not match Version header ($header) / VERSION const ($const)"
            exit 1
          fi

      # The mu-plugins loader stays out: as a regular plugin it would show up as a second plugin.
      - name: Build zip
        run: zip -r ds-webp-squoosh.zip ds-webp-squoosh -x 'ds-webp-squoosh/ds-webp-squoosh-loader.php' '*.DS_Store'

      - name: Upload to release
        run: gh release upload "$GITHUB_REF_NAME" ds-webp-squoosh.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
